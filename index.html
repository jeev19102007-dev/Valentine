<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Will You Be My Valentine? ❤️</title>

  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Roboto&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <audio id="music" loop>
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <div class="container">
    <h1>Will You Be My Valentine? ❤️</h1>

    <p class="name">Ma (Bhavya)</p>

    <p class="message" id="typing-text"></p>

    <div class="buttons">
      <button id="yes-btn">Yes! ❤️</button>
      <button id="no-btn">No 😢</button>
    </div>

    <div id="response" class="hidden">
      <p>Yay! You just made me the happiest person ever 💖</p>
      <p>Our Valentine starts now 🥰🌹</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
